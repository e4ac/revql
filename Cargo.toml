[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["e4ac"]
categories = ["command-line-utilities"]
description = "GraphQL Object Reverse Lookup"
edition = "2024"
keywords = ["GraphQL"]
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/e4ac/revql"
version = "0.1.0"

[workspace.dependencies]
clap = { features = ["derive"], version = "4.6" }
colored = { version = "3.1" }
graphql-introspection-query = { version = "0.3" }
reqwest = { features = ["json", "query"], version = "0.13" }
rmcp = { features = ["macros", "server", "transport-io"], version = "3.5" }
schemars = { version = "1.2" }
serde = { features = ["derive"], version = "1.0" }
serde_json = { version = "1.0" }
tempfile = { version = "3.27" }
thiserror = { version = "2.0" }
tokio = { features = ["full"], version = "1.53" }

revql-core = { path = "crates/revql-core" }

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
indexing_slicing = "warn"
missing_errors_doc = "allow"
multiple_crate_versions = "allow"
panic = "warn"
ref_patterns = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
string_slice = "warn"
todo = "warn"
try_err = "warn"
unchecked_time_subtraction = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
